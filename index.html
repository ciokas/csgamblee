<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSGamble</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#020617;border-bottom:1px solid #111}
button{background:#2563eb;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}
button:hover{opacity:.9}
.section{padding:20px}

.case-grid{display:flex;gap:15px;flex-wrap:wrap}
.case-card{width:140px;background:#020617;border:1px solid #111;border-radius:8px;padding:10px;text-align:center;cursor:pointer}
.case-card img{width:80px}

.modal{position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.8)}
.modal-box{background:#020617;padding:20px;border-radius:10px;width:95%;max-width:900px}

.spinner{position:relative;overflow:hidden;height:130px;border:1px solid #111}
.strip{display:flex}
.item{width:110px;text-align:center;flex-shrink:0}
.item img{width:60px}

.indicator{position:absolute;top:0;bottom:0;width:3px;background:red;left:50%}

.legendary{color:#facc15}
.epic{color:#a855f7}
.rare{color:#60a5fa}

.inventory{display:flex;gap:10px;flex-wrap:wrap}
.inv-item{width:90px;border:1px solid #111;padding:5px;text-align:center}

.roulette{position:relative;height:100px;overflow:hidden;border:1px solid #111}
#wheel{display:flex}
.roulette-item{width:80px;text-align:center;padding:30px 0;font-weight:bold}
.red{background:#dc2626}
.black{background:#111}
.green{background:#16a34a}
</style>
</head>

<body>

<div class="topbar">
  <b>CSGamble</b>
  <div>
    <button onclick="show('cases')">Cases</button>
    <button onclick="show('battle')">Case Battle</button>
    <button onclick="show('roulette')">Roulette</button>
  </div>
  <div id="balance">€100</div>
</div>

<!-- CASES -->
<section id="cases" class="section">
<h2>Cases</h2>
<div id="caseGrid" class="case-grid"></div>
</section>

<!-- CASE BATTLE -->
<section id="battle" class="section hidden">
<h2>Case Battle vs BOT</h2>
<button onclick="startBattle()">Start Battle</button>
<div id="battleLog"></div>
</section>

<!-- ROULETTE -->
<section id="roulette" class="section hidden">
<h2>Roulette</h2>
<div class="roulette">
  <div id="wheel"></div>
  <div class="indicator"></div>
</div>
<br>
<input id="bet" type="number" value="5">
<button onclick="spin('red')">Red x2</button>
<button onclick="spin('black')">Black x2</button>
<button onclick="spin('green')">Green x14</button>
</section>

<!-- INVENTORY -->
<section class="section">
<h2>Inventory</h2>
<div id="inv" class="inventory"></div>
</section>

<!-- CASE MODAL -->
<div id="caseModal" class="modal">
<div class="modal-box">
<h3 id="caseTitle"></h3>
<div class="spinner">
  <div id="strip" class="strip"></div>
  <div class="indicator"></div>
</div>
<br>
<button onclick="openCase()">Open Case</button>
<button onclick="closeModal()">Exit</button>
<div id="result"></div>
</div>
</div>

<script src="js/main.js"></script>
</body>
</html>
