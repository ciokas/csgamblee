<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSGamble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    .hidden { display: none; }

    .modal {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      justify-content:center;
      align-items:center;
      background: rgba(0,0,0,0.7);
    }

    .modal-box {
      background:#111;
      padding:20px;
      border-radius:10px;
      text-align:center;
      max-width:600px;
      width:90%;
    }

    #resultImg { display:none; max-width:100px; margin-top:10px; }

    /* case strip */
    .spinner {
      position: relative;
      overflow: hidden;
      height: 120px;
      margin: 15px 0;
      background: #020617;
    }

    #caseStrip {
      display: flex;
    }

    .caseItem {
      width: 100px;
      margin: 0 5px;
      text-align: center;
      background: #020617;
      flex-shrink: 0;
    }

    .indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: red;
      left: 50%;
    }

    /* roulette */
    #rouletteWheel {
      display: flex;
      overflow: hidden;
      width: 600px;
      transition: transform 3s cubic-bezier(0.15,0.8,0.2,1);
    }

    .roulette-item {
      width: 80px;
      text-align: center;
      padding: 25px 0;
      color:white;
      font-weight:bold;
    }

    .red { background: #dc2626; }
    .black { background: #111; }
    .green { background: #16a34a; }

    .roulette-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: yellow;
      left: 50%;
    }

    .case-grid { display:flex; flex-wrap:wrap; gap:15px; margin-top:15px; }
    .case-card { width:120px; background:#111; padding:10px; border-radius:8px; text-align:center; cursor:pointer; transition:0.2s; }
    .case-card:hover { transform:scale(1.05); }

    .inventory { margin-top:20px; }
    #inventoryGrid { display:flex; flex-wrap:wrap; gap:10px; }
    .inv-item { width:80px; background:#111; padding:5px; border-radius:6px; text-align:center; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">CSGamble</div>
  <div class="nav">
    <button onclick="showSection('cases')">Cases</button>
    <button onclick="showSection('roulette')">Roulette</button>
  </div>
  <div class="balance">Balance: €100.00</div>
</div>

<section id="cases" class="section">
  <h2>Cases</h2>
  <div id="caseGrid" class="case-grid"></div>
</section>

<section id="roulette" class="section hidden">
  <h2>Roulette</h2>

  <div class="roulette" style="position:relative; height:100px; overflow:hidden;">
    <div id="rouletteWheel"></div>
    <div class="roulette-indicator"></div>
  </div>

  <div class="roulette-controls" style="margin-top:15px;">
    <input type="number" id="betAmount" value="5" min="1" style="width:60px;">
    <button onclick="placeBet('red')">Red</button>
    <button onclick="placeBet('black')">Black</button>
    <button onclick="placeBet('green')">Green</button>
  </div>
</section>

<section id="inventory" class="inventory">
  <h2>Inventory</h2>
  <div id="inventoryGrid"></div>
</section>

<!-- CASE MODAL -->
<div id="caseModal" class="modal">
  <div class="modal-box">
    <h3 id="caseTitle"></h3>

    <div class="spinner">
      <div id="caseStrip"></div>
      <div class="indicator"></div>
    </div>

    <button id="openCaseBtn">Open Case</button>

    <div id="result">
      <p id="resultText"></p>
      <img id="resultImg">
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
