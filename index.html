<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSGamble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div class="topbar">
  <div class="logo">CSGamble</div>
  <div class="nav">
    <button onclick="showSection('cases')">Cases</button>
    <button onclick="showSection('roulette')">Roulette</button>
    <button onclick="showSection('caseBattle')">Case Battle</button>
    <button onclick="showSection('inventory')">Inventory</button>
    <button onclick="showSection('minigames')">Mini Games</button>
    <button onclick="showSection('profile')">Profile</button>
  </div>
  <div class="balance">Balance: €100.00</div>
</div>

<!-- CASES -->
<section id="cases" class="section">
  <h2>Cases</h2>
  <div id="caseGrid" class="case-grid"></div>
  <div>
    <label for="multiOpen">Open # of cases:</label>
    <select id="multiOpen">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <button id="instaSpinBtn">Insta Spin</button>
  </div>
</section>

<!-- CASE MODAL -->
<div id="caseModal" class="modal">
  <div class="modal-box">
    <h3 id="caseTitle"></h3>

    <div class="spinner-container" id="spinnerContainer"></div>

    <button id="closeCaseModalBtn">Exit</button>
  </div>
</div>

<!-- ROULETTE -->
<section id="roulette" class="section hidden">
  <h2>Roulette</h2>
  <div class="roulette" style="position:relative; height:100px; overflow:hidden;">
    <div id="rouletteWheel"></div>
    <div class="roulette-indicator"></div>
  </div>
  <div class="roulette-controls">
    <input type="number" id="betAmount" value="5" min="1">
    <button onclick="placeBet('red')">Red (2x)</button>
    <button onclick="placeBet('black')">Black (2x)</button>
    <button onclick="placeBet('green')">Green (14x)</button>
  </div>
</section>

<!-- CASE BATTLE -->
<section id="caseBattle" class="section hidden">
  <h2>Case Battle</h2>
  <button id="startBattleBtn">Start Battle</button>
  <div id="battleLog"></div>
</section>

<!-- INVENTORY -->
<section id="inventory" class="section hidden">
  <h2>Inventory</h2>
  <div id="inventoryGrid"></div>
  <button id="sellAllBtn">Sell All Skins</button>
</section>

<!-- MINI GAMES -->
<section id="minigames" class="section hidden">
  <h2>Mini Games</h2>
  <button onclick="startTower()">Tower</button>
  <button onclick="startMines()">Mines</button>
  <button onclick="startCrash()">Crash</button>
</section>

<!-- PROFILE -->
<section id="profile" class="section hidden">
  <h2>Profile</h2>
  <div>XP: <span id="xpCount">0</span></div>
  <div>Level: <span id="levelCount">1</span></div>
  <div id="playerNick">Nick: Player</div>
</section>

<script src="js/main.js"></script>
</body>
</html>
