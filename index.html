<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>CS2 Gamble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎰 CS2 Gamble</h1>

<!-- CASE OPENING -->
<section>
    <h2>📦 Case Opening</h2>
    <img src="images/starter_case.png" width="140">
    <br>
    <button onclick="openCase()">Atidaryti Case</button>
    <div id="caseResult"></div>
</section>

<!-- INVENTORY -->
<section>
    <h2>🎒 Inventory</h2>
    <div id="inventory"></div>
</section>

<hr>

<!-- MINES -->
<section>
    <h2>💣 Mines</h2>

    <select id="bombCount">
        <option value="3">3 Bombos</option>
        <option value="5">5 Bombos</option>
        <option value="10">10 Bombų</option>
    </select>

    <button onclick="startMines()">Start</button>
    <button onclick="cashoutMines()">Cashout</button>

    <p>Multiplier: <span id="multiplier">1.00x</span></p>
    <div id="minesGrid" class="grid"></div>
    <p id="minesStatus"></p>
</section>

<hr>

<!-- CASE BATTLE -->
<section>
    <h2>⚔️ Case Battle (Animated)</h2>
    <button onclick="startAnimatedBattle()">Pradėti Battle</button>

    <div class="battle">
        <div>
            <h3>Tu</h3>
            <div class="roller">
                <div id="playerRoll" class="roll-track"></div>
            </div>
        </div>

        <div>
            <h3>Bot</h3>
            <div class="roller">
                <div id="botRoll" class="roll-track"></div>
            </div>
        </div>
    </div>

    <h3 id="battleResult"></h3>
</section>

<script src="main.js"></script>
</body>
</html>
