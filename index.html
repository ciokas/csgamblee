<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSGamble Demo</title>
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">CSGamble</div>
    <nav>
      <button data-section="cases" class="active">Cases</button>
      <button data-section="roulette">Roulette</button>
    </nav>
    <div class="balance">Balance: €100</div>
  </div>

  <!-- MAIN -->
  <main>
    <!-- CASES SECTION -->
    <section id="cases" class="section active">
      <h2>Cases</h2>
      <div class="case-grid" id="caseGrid"></div>
    </section>

    <!-- ROULETTE SECTION (bus vėliau) -->
    <section id="roulette" class="section">
      <h2>Roulette</h2>
      <p>Coming soon...</p>
    </section>
  </main>

  <!-- CASE MODAL -->
  <div id="caseModal" class="modal">
    <div class="modal-box">
      <h3 id="caseTitle"></h3>

      <div class="spinner">
        <div id="caseStrip"></div>
        <div class="indicator"></div>
      </div>

      <button id="openCaseBtn">🎁 Open Case</button>

      <div id="result" class="result">
        <p id="resultText"></p>
        <img id="resultImg">
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="js/main.js"></script>

</body>
</html>
