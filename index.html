<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSGamble</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">

<style>
.hidden{display:none}
body{background:#020617;color:white;font-family:Arial}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#020617}
.case-grid{display:flex;gap:15px;flex-wrap:wrap}
.case-card{background:#0b1220;padding:10px;width:150px;border-radius:8px;text-align:center;cursor:pointer}
.case-card:hover{transform:scale(1.05)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center}
.modal-box{background:#0b1220;padding:20px;border-radius:12px;width:95%;max-width:1000px}

.spinner{position:relative;overflow:hidden;height:150px;background:#020617;margin:10px 0}
#caseStrip{display:flex}
.caseItem{width:120px;margin:0 5px;text-align:center}
.indicator{position:absolute;top:0;bottom:0;width:3px;background:red;left:50%}

.inventory{margin-top:20px}
.inv-item{background:#0b1220;width:130px;padding:6px;border-radius:6px;text-align:center}
.sell-btn{background:#dc2626;border:none;color:white;width:100%;cursor:pointer}

.roulette{position:relative;height:100px;overflow:hidden;margin-top:10px}
#rouletteWheel{display:flex}
.roulette-item{width:80px;text-align:center;padding:25px 0;font-weight:bold}
.red{background:#dc2626}
.black{background:#111}
.green{background:#16a34a}
.roulette-indicator{position:absolute;top:0;bottom:0;width:4px;background:yellow;left:50%}
</style>
</head>

<body>

<div class="topbar">
  <div>CSGamble</div>
  <div>
    <button onclick="showSection('cases')">Cases</button>
    <button onclick="showSection('roulette')">Roulette</button>
  </div>
  <div class="balance">Balance: €100.00</div>
</div>

<section id="cases" class="section">
<h2>Cases</h2>
<div id="caseGrid" class="case-grid"></div>
</section>

<section id="roulette" class="section hidden">
<h2>Roulette</h2>

<div class="roulette">
  <div id="rouletteWheel"></div>
  <div class="roulette-indicator"></div>
</div>

<input type="number" id="betAmount" value="5" min="1">

<button onclick="placeBet('red')">Red (2x)</button>
<button onclick="placeBet('black')">Black (2x)</button>
<button onclick="placeBet('green')">Green (14x)</button>
</section>

<section class="inventory">
<h2>Inventory</h2>
<div id="inventoryGrid"></div>
</section>

<div id="caseModal" class="modal">
<div class="modal-box">

<button onclick="closeCase()" style="float:right">✖</button>
<h3 id="caseTitle"></h3>

<label>Cases:
<select id="caseCount">
<option>1</option><option>2</option><option>3</option><option>4</option>
</select>
</label>

<label>
<input type="checkbox" id="instaSpin"> Insta Spin
</label>

<div class="spinner">
  <div id="caseStrip"></div>
  <div class="indicator"></div>
</div>

<button id="openCaseBtn">Open</button>

</div>
</div>

<script src="js/main.js"></script>
</body>
</html>
