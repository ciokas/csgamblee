<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSGamble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background:#020617; color:#fff; font-family:Arial,sans-serif; margin:0; }
    .hidden { display:none; }

    .topbar {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 20px; background:#020617; border-bottom:1px solid #1e293b;
    }

    .nav button {
      margin-right:8px; background:#111827; color:white;
      border:none; padding:8px 12px; cursor:pointer; border-radius:6px;
    }

    .balance { font-weight:bold; }

    section { padding:20px; }

    /* CASES */
    .case-grid { display:flex; gap:15px; flex-wrap:wrap; }
    .case-card {
      width:140px; background:#020617; border:1px solid #1e293b;
      padding:10px; border-radius:8px; text-align:center; cursor:pointer;
    }
    .case-card img { width:100px; }

    /* MODAL */
    .modal {
      position:fixed; inset:0; background:rgba(0,0,0,0.85);
      display:flex; justify-content:center; align-items:center;
    }

    .modal-box {
      background:#020617; padding:20px; border-radius:12px;
      width:90%; max-width:900px;
    }

    /* CASE STRIP */
    .spinner {
      position:relative; overflow:hidden; height:130px;
      background:#020617; border:1px solid #1e293b; margin:15px 0;
    }

    .caseStrip { display:flex; }

    .caseItem {
      width:120px; flex-shrink:0; text-align:center;
    }

    .caseItem img { width:80px; }

    .indicator {
      position:absolute; top:0; bottom:0; width:3px;
      background:#facc15; left:50%;
    }

    /* INVENTORY */
    #inventoryGrid { display:flex; gap:10px; flex-wrap:wrap; }
    .inv-item {
      width:120px; background:#020617; border:1px solid #1e293b;
      padding:8px; border-radius:8px; text-align:center;
    }

    /* ROULETTE */
    .roulette-wrap {
      position:relative; height:100px; overflow:hidden;
      border:1px solid #1e293b;
    }

    #rouletteWheel { display:flex; }

    .roulette-item {
      width:80px; padding:25px 0;
      text-align:center; font-weight:bold;
    }

    .red { background:#dc2626; }
    .black { background:#020617; }
    .green { background:#16a34a; }

    .roulette-indicator {
      position:absolute; top:0; bottom:0;
      width:4px; background:#facc15; left:50%;
    }

    button.primary {
      background:#2563eb; color:white; border:none;
      padding:10px 14px; border-radius:6px; cursor:pointer;
    }
  </style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo"><b>CSGamble</b></div>
  <div class="nav">
    <button onclick="showSection('cases')">Cases</button>
    <button onclick="showSection('battle')">Case Battle</button>
    <button onclick="showSection('roulette')">Roulette</button>
    <button onclick="showSection('inventory')">Inventory</button>
  </div>
  <div class="balance" id="balanceText">€0.00</div>
</div>

<!-- CASES -->
<section id="cases">
  <h2>Cases</h2>
  <div id="caseGrid" class="case-grid"></div>
</section>

<!-- CASE BATTLE -->
<section id="battle" class="hidden">
  <h2>Case Battle (vs Bot)</h2>
  <button class="primary" onclick="startCaseBattle()">Start Battle</button>
  <div id="battleArea"></div>
</section>

<!-- ROULETTE -->
<section id="roulette" class="hidden">
  <h2>Roulette</h2>

  <div class="roulette-wrap">
    <div id="rouletteWheel"></div>
    <div class="roulette-indicator"></div>
  </div>

  <div style="margin-top:15px;">
    Bet:
    <input type="number" id="betAmount" value="5" min="1" style="width:60px;">
    <button onclick="betColor('red')">Red (x2)</button>
    <button onclick="betColor('black')">Black (x2)</button>
    <button onclick="betColor('green')">Green (x14)</button>
  </div>
</section>

<!-- INVENTORY -->
<section id="inventory" class="hidden">
  <h2>Inventory</h2>
  <div id="inventoryGrid"></div>
</section>

<!-- CASE MODAL -->
<div id="caseModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="caseTitle"></h3>

    <div id="caseSpins"></div>

    <button class="primary" onclick="openSelectedCase()">Open</button>
    <button onclick="closeCase()">Close</button>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
